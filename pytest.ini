[pytest]
# This machine's global Python 3.12 site-packages includes an unrelated
# "langsmith_plugin" pytest plugin (pytest11 entry point: langsmith.pytest_plugin)
# that crashes on import due to a pydantic/pydantic-core version mismatch in
# that environment. It has nothing to do with EXPC-GVP; disable its autoload
# so `pytest` works out of the box here without requiring
# PYTEST_DISABLE_PLUGIN_AUTOLOAD.
addopts = -p no:langsmith_plugin
